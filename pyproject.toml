[project]
name = "speechflow"
dynamic = ["version"]
description = "Engine-neutral async-first TTS contracts and audio utilities"
readme = "README.md"
authors = [
    { name = "minamik", email = "mia@sync.dev" },
]
license = "MIT"
requires-python = ">=3.12,<3.14"
keywords = ["tts", "text-to-speech", "speech-synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26.4",
]

[project.urls]
Repository = "https://github.com/sync-dev-org/speechflow"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "ruff",
    "mypy>=2.2.0",
    "noren==0.2.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
root = "."
relative_to = "pyproject.toml"
fallback_version = "0.16.0"
tag_regex = "^v(?P<version>[^/]+)$"
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v*",
]

[tool.hatch.build.hooks.vcs]
version-file = "src/speechflow/_version.py"

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/speechflow"]

[tool.hatch.build.targets.sdist]
only-include = ["src/speechflow", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = ["req(id): spec item ID (SP-*) that a behavior test verifies"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
respect-gitignore = false
exclude = [
    ".git",
    ".nf",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "**/__pycache__",
    "**/*.egg-info",
    "**/_version.py",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["src"]
files = ["src", "tests"]
exclude = ["src/speechflow/_version.py"]

[tool.coverage.run]
source = ["src/speechflow"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
